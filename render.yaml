services:
  - type: web
    name: kashi-vashi-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CEO_INITIAL_PASSWORD
        sync: false
      - key: MANAGER_INITIAL_PASSWORD
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: AUTOMATION_ENABLED
        value: "true"
      - key: NOTIFICATION_PROVIDER
        value: ProductionProvider
      - key: LOG_LEVEL
        value: info
